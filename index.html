<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soutien à la communauté LGBTQ+</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ff6b6b;
        }
        .rainbow-flag {
            width: 300px;
            height: auto;
            margin-top: 20px;
        }
        p {
            font-size: 1.2em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>L'amour est l'amour</h1>
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Rainbow_flag.svg" alt="Drapeau arc-en-ciel" class="rainbow-flag">
    <p>Nous nous solidarisons avec la communauté LGBTQ+. L'amour ne connaît pas de frontières, et chaque personne mérite d'être traitée avec respect et dignité.</p>
    <p>Soyez fier, soyez vous-même !</p>
</body>
</html>
