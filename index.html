<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support for the LGBTQ+ Community</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #ff6b6b;
        }
        .rainbow-flag {
            width: 300px;
            height: auto;
            margin-top: 20px;
        }
        p {
            font-size: 1.2em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Love is Love</h1>
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Rainbow_flag.svg" alt="Rainbow Flag" class="rainbow-flag">
    <p>We stand in solidarity with the LGBTQ+ community. Love knows no boundaries, and everyone deserves to be treated with respect and dignity.</p>
    <p>Be proud, be you!</p>
</body>
</html>
